<svg xmlns="http://www.w3.org/2000/svg" width="752" height="290" viewBox="0 0 752 290" role="img" aria-label="Ayaan Ajaney profile">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
      .p   { fill: #4ade80; }
      .cmd { fill: #e5e7eb; }
      .lab { fill: #4b5563; }
      .val { fill: #d1d5db; }
      .acc { fill: #4ade80; }
      .ttl { fill: #4b5563; font-size: 13px; }
      .sep { fill: #374151; }
    </style>
    <clipPath id="c1"><rect x="0" y="0" width="752" height="290"><animate attributeName="width" values="0;752" dur="0.45s" begin="0.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="0" width="752" height="290"><animate attributeName="width" values="0;0;752" keyTimes="0;0.55;1" dur="1.35s" begin="0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="0" width="752" height="290"><animate attributeName="width" values="0;0;752" keyTimes="0;0.66;1" dur="2.05s" begin="0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="0" y="0" width="752" height="290"><animate attributeName="width" values="0;0;752" keyTimes="0;0.745;1" dur="2.75s" begin="0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="0" y="0" width="752" height="290"><animate attributeName="width" values="0;0;752" keyTimes="0;0.775;1" dur="3.55s" begin="0s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="751" height="289" rx="10" fill="#080b09" stroke="#14301f" stroke-width="1"/>
  <path d="M0.5 10.5 a10 10 0 0 1 10-10 h731 a10 10 0 0 1 10 10 v29.5 h-751 z" fill="#0d1a12"/>
  <line x1="0.5" y1="40" x2="751.5" y2="40" stroke="#14301f" stroke-width="1"/>
  <circle cx="24" cy="20" r="6" fill="#4ade80" opacity="0.85"/>
  <circle cx="46" cy="20" r="6" fill="#1f3d2b"/>
  <circle cx="68" cy="20" r="6" fill="#1f3d2b"/>
  <text class="mono ttl" x="96" y="25">~/profile</text>

  <g clip-path="url(#c1)">
    <text class="mono" x="28" y="86"><tspan class="p">&#9654;</tspan><tspan class="cmd" dx="10">cat profile</tspan></text>
  </g>
  <g clip-path="url(#c2)">
    <text class="mono lab" x="28"  y="132">name</text>
    <text class="mono val" x="150" y="132">Ayaan Ajaney</text>
  </g>
  <g clip-path="url(#c3)">
    <text class="mono lab" x="28"  y="160">education</text>
    <text class="mono val" x="150" y="160">BS Computer Science, Georgia Institute of Technology</text>
  </g>
  <g clip-path="url(#c4)">
    <text class="mono lab" x="28"  y="188">focus</text>
    <text class="mono val" x="150" y="188">Cybersecurity and Privacy<tspan class="sep">  ·  </tspan>Information Internetworks</text>
  </g>
  <g clip-path="url(#c5)">
    <text class="mono lab" x="28"  y="216">work</text>
    <text class="mono acc" x="150" y="216">Detection engineering<tspan class="sep">  ·  </tspan>Binary exploitation<tspan class="sep">  ·  </tspan>Routing security</text>
  </g>

  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.95;1" dur="3.8s" begin="0s" fill="freeze"/>
    <text class="mono p" x="28" y="258">&#9654;</text>
    <rect x="48" y="246" width="9" height="16" fill="#4ade80">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
