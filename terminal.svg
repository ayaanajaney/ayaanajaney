<svg xmlns="http://www.w3.org/2000/svg" width="752" height="278" viewBox="0 0 752 278" role="img" aria-label="Ayaan Ajaney profile">
  <defs>
    <style>
      .mono  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
      .p     { fill: #4ade80; }
      .cmd   { fill: #e5e7eb; }
      .lab   { fill: #6b7280; }
      .val   { fill: #d1d5db; }
      .acc   { fill: #4ade80; }
      .ttl   { fill: #6b7280; font-size: 13px; }
      .sep   { fill: #3f3f46; }
    </style>
    <clipPath id="c1"><rect x="0" y="0" width="0" height="278"><animate attributeName="width" from="0" to="752" dur="0.45s" begin="0.2s"  fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="0" width="0" height="278"><animate attributeName="width" from="0" to="752" dur="0.50s" begin="0.85s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="0" width="0" height="278"><animate attributeName="width" from="0" to="752" dur="0.70s" begin="1.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="0" y="0" width="0" height="278"><animate attributeName="width" from="0" to="752" dur="0.70s" begin="2.05s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="0" y="0" width="0" height="278"><animate attributeName="width" from="0" to="752" dur="0.80s" begin="2.75s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="0" y="0" width="752" height="278" rx="10" fill="#0a0a0a"/>
  <rect x="0" y="0" width="752" height="40" rx="10" fill="#141414"/>
  <rect x="0" y="30" width="752" height="10" fill="#141414"/>
  <line x1="0" y1="40" x2="752" y2="40" stroke="#1f1f1f" stroke-width="1"/>
  <circle cx="24" cy="20" r="6" fill="#3f3f46"/>
  <circle cx="46" cy="20" r="6" fill="#3f3f46"/>
  <circle cx="68" cy="20" r="6" fill="#3f3f46"/>
  <text class="mono ttl" x="96" y="25">~/profile</text>

  <g clip-path="url(#c1)">
    <text class="mono" x="28" y="84"><tspan class="p">$</tspan><tspan class="cmd" dx="9">cat profile</tspan></text>
  </g>
  <g clip-path="url(#c2)">
    <text class="mono lab" x="28" y="130">name</text>
    <text class="mono val" x="150" y="130">Ayaan Ajaney</text>
  </g>
  <g clip-path="url(#c3)">
    <text class="mono lab" x="28" y="158">education</text>
    <text class="mono val" x="150" y="158">BS Computer Science, Georgia Institute of Technology</text>
  </g>
  <g clip-path="url(#c4)">
    <text class="mono lab" x="28" y="186">focus</text>
    <text class="mono val" x="150" y="186">Cybersecurity and Privacy<tspan class="sep">  ·  </tspan>Information Internetworks</text>
  </g>
  <g clip-path="url(#c5)">
    <text class="mono lab" x="28" y="214">work</text>
    <text class="mono acc" x="150" y="214">Detection engineering<tspan class="sep">  ·  </tspan>Binary exploitation<tspan class="sep">  ·  </tspan>Routing security</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.6s" fill="freeze"/>
    <text class="mono p" x="28" y="252">$</text>
    <rect x="46" y="240" width="9" height="16" fill="#4ade80">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
